<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Pipes in. Legacy flags out.</title><desc id="desc">Configuration can now arrive by pipe, while named profiles make the old CLI contract explicit.</desc><rect width="1600" height="1000" fill="#f4eddf"/><style>text{fill:#171511;font-family:Georgia,serif}.mono{font-family:ui-monospace,monospace}.muted{fill:#6d675d}.accent{fill:#a32921}</style><text x="800" y="64" text-anchor="middle" class="mono accent" font-size="20" font-weight="700" letter-spacing="5">SAMPLE-CLI / V2.0.0</text><path d="M80 90H1520M80 102H1520" stroke="#171511" stroke-width="4"/><text x="800" y="190" text-anchor="middle" font-size="86" font-weight="700" letter-spacing="-3">Pipes in. Legacy flags out.</text><text x="800" y="284" text-anchor="middle" class="muted" font-size="25">Configuration can now arrive by pipe, while named profiles make the old</text><text x="800" y="318" text-anchor="middle" class="muted" font-size="25">CLI contract explicit.</text><rect x="80" y="410" width="1440" height="112" fill="#e7ddcb" stroke="#171511"/><path d="M560 410V522M1040 410V522" stroke="#171511"/><text x="320" y="459" text-anchor="middle" font-size="38" font-weight="700">3</text><text x="320" y="492" text-anchor="middle" class="mono muted" font-size="15" letter-spacing="2">COMMITS</text><text x="800" y="459" text-anchor="middle" font-size="38" font-weight="700">7</text><text x="800" y="492" text-anchor="middle" class="mono muted" font-size="15" letter-spacing="2">FILES CHANGED</text><text x="1280" y="459" text-anchor="middle" font-size="38" font-weight="700">+65 / -1</text><text x="1280" y="492" text-anchor="middle" class="mono muted" font-size="15" letter-spacing="2">LINES CHANGED</text><path d="M80 568H760" stroke="#171511" stroke-width="4"/><text x="80" y="600" font-size="26" font-weight="700" letter-spacing="2">FEATURES</text><text x="80" y="630" font-size="19">The CLI now accepts configuration from stdin.</text><text x="755" y="630" text-anchor="end" class="mono muted" font-size="14">6e1dedb</text><path d="M80 683H760" stroke="#171511" stroke-width="4"/><text x="80" y="715" font-size="26" font-weight="700" letter-spacing="2">BREAKING CHANGES</text><text x="80" y="745" font-size="19">Named profiles replace the legacy CLI option.</text><text x="755" y="745" text-anchor="end" class="mono muted" font-size="14">c0f3022</text><path d="M840 568H1520" stroke="#171511" stroke-width="4"/><text x="840" y="600" font-size="26" font-weight="700" letter-spacing="2">FIXES</text><text x="840" y="630" font-size="19">YAML parsing now preserves &lt;edge&gt; values.</text><text x="1515" y="630" text-anchor="end" class="mono muted" font-size="14">b3cd40b</text><text x="80" y="942" class="mono muted" font-size="14">Poster shows 3 of 3 commits; full notes contain every change.</text><text x="80" y="968" class="mono muted" font-size="16">Draft: verify user impact and migration advice before publishing.</text></svg>
